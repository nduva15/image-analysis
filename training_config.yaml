# BetterBee SOTA Training Config v2.1
# Architecture: JFST-DETR (Small Target Transformer)
# Optimization for sub-10px phoretic mites on 400k dataset

model:
  backbone: Swin-Small-V2
  encoder_layers: 6
  decoder_layers: 6
  num_feature_levels: 4 # High-res pyramids for Varroa (1mm)
  hidden_dim: 256
  nheads: 8
  dropout: 0.1
  
loss:
  type: Focaler-IoU # Specifically focuses on small-scale regression
  weights:
    class: 2.0
    bbox: 5.0
    giou: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

augmentation:
  sahi_tiling: true # Sliced Aided Hyper Inference
  slice_height: 512
  slice_width: 512
  overlap: 0.25
  mosaic_prob: 0.5
  mixup_prob: 0.1
  color_jitter: 0.2
  hflip: 0.5

optimizer:
  type: AdamW
  lr: 0.0002
  weight_decay: 0.0001
  lr_scheduler: CosineAnnealingLR
  warmup_epochs: 5

dataset:
  train_path: "data/gold_tier/train"
  val_path: "data/gold_tier/val"
  num_classes: 2 # [bee, varroa]
  img_size: 1280
  batch_size: 16
  workers: 8
